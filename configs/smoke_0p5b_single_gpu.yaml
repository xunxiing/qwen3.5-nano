seed: 42
output_dir: outputs/smoke_0p5b
device: cuda
dtype: bfloat16

model:
  text_model_name: Qwen/Qwen2.5-0.5B-Instruct
  trust_remote_code: true
  text_max_length: 128
  image_vocab_size: 4096
  image_seq_len: 64
  hidden_size: 768
  num_layers: 8
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.0
  gradient_checkpointing: false

data:
  train_manifest: data/train.jsonl
  batch_size: 1
  num_workers: 0
  cfg_dropout_prob: 0.1
  unconditional_text: ""

train:
  max_steps: 2
  lr: 0.0001
  weight_decay: 0.01
  grad_accum_steps: 1
  log_every: 1
  save_every: 2
  max_grad_norm: 1.0
