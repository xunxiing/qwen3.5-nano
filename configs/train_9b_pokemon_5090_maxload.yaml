seed: 42
output_dir: outputs/train_9b_pokemon_5090_maxload
device: cuda
dtype: bfloat16

model:
  text_model_name: /root/autodl-tmp/models/Qwen3.5-9B
  trust_remote_code: true
  text_max_length: 64
  image_vocab_size: 16384
  image_seq_len: 256
  hidden_size: 1024
  num_layers: 12
  num_heads: 16
  mlp_ratio: 4.0
  dropout: 0.0
  gradient_checkpointing: true

data:
  train_manifest: data/pokemon_blip_tokens.jsonl
  batch_size: 4
  num_workers: 6
  cfg_dropout_prob: 0.0
  unconditional_text: ""

train:
  max_steps: 12000
  lr: 0.00005
  weight_decay: 0.0
  grad_accum_steps: 1
  log_every: 10
  save_every: 500
  max_grad_norm: 1.0
  resume_from: outputs/train_9b_pokemon_5090_stable/decoder_step_1000.pt
