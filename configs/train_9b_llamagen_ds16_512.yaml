seed: 42
output_dir: outputs/train_9b_llamagen_ds16_512
device: cuda
dtype: bfloat16

model:
  text_model_name: /root/autodl-tmp/models/Qwen3.5-9B
  trust_remote_code: true
  text_max_length: 256
  image_vocab_size: 16384
  image_seq_len: 1024
  hidden_size: 1024
  num_layers: 12
  num_heads: 16
  mlp_ratio: 4.0
  dropout: 0.0
  gradient_checkpointing: true

data:
  train_manifest: data/laion_aesthetics_tokens.jsonl
  batch_size: 1
  num_workers: 4
  cfg_dropout_prob: 0.1
  unconditional_text: ""

train:
  max_steps: 100000
  lr: 0.0001
  weight_decay: 0.01
  grad_accum_steps: 16
  log_every: 10
  save_every: 500
  max_grad_norm: 1.0

