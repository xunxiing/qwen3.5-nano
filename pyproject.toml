[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen35-nano"
version = "0.1.0"
description = "Single-GPU bootstrap for Qwen-based autoregressive text-to-image experiments."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.4.0",
  "datasets>=4.0.0",
  "einops>=0.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.3",
  "pillow>=10.4.0",
  "pytorch-lightning>=2.5.0",
  "pyarrow>=17.0.0",
  "pyyaml>=6.0.2",
  "safetensors>=0.5.3",
  "transformers>=5.3.0",
  "sentencepiece>=0.2.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
